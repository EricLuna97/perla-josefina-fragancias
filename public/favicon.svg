<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="lotusGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fda4af" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>
  <!-- Background gentle circle -->
  <circle cx="32" cy="32" r="30" fill="#FBFBF9" stroke="#fecdd3" stroke-width="1.5" />
  
  <!-- Base leaves -->
  <path d="M12 42 C 22 47, 42 47, 52 42 C 45 49, 19 49, 12 42 Z" fill="url(#leafGrad)" opacity="0.85" />
  
  <!-- Outer Petals -->
  <path d="M14 36 C 18 24, 28 26, 32 39 C 24 38, 17 38, 14 36 Z" fill="url(#lotusGrad)" opacity="0.8" />
  <path d="M50 36 C 46 24, 36 26, 32 39 C 40 38, 47 38, 50 36 Z" fill="url(#lotusGrad)" opacity="0.8" />
  
  <!-- Intermediate Petals -->
  <path d="M20 38 C 21 20, 30 18, 32 38 C 26 38, 22 39, 20 38 Z" fill="url(#lotusGrad)" opacity="0.9" />
  <path d="M44 38 C 43 20, 34 18, 32 38 C 38 38, 42 39, 44 38 Z" fill="url(#lotusGrad)" opacity="0.9" />
  
  <!-- Central Petal -->
  <path d="M32 14 C 27 22, 26 33, 32 40 C 38 33, 37 22, 32 14 Z" fill="url(#lotusGrad)" />
  
  <!-- Lotus center detail -->
  <circle cx="32" cy="36" r="2.5" fill="#fef08a" />
</svg>
