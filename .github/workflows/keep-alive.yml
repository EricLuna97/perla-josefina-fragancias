name: Supabase Keep Alive

on:
  schedule:
    # Corre lunes, miércoles y viernes a las 11:00 UTC
    - cron: '0 11 * * 1,3,5'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Supabase Client
        run: npm install @supabase/supabase-js

      - name: Ping Supabase Database via SDK
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          node -e "
            const { createClient } = require('@supabase/supabase-js');
            const supabase = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_ANON_KEY);
            
            async function run() {
              const { data, error } = await supabase.from('categories').select('id').limit(1);
              if (error) {
                console.error('Error al hacer ping a Supabase:', error);
                process.exit(1);
              }
              console.log('¡Ping exitoso! Base de datos activa:', data);
            }
            run();
          "